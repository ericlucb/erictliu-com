  html, body { margin: 0; height: 100%; overflow: hidden; background: #5d5f7e; }

  #hud {
    position: fixed; left: 29%; top: 61%;
    transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
    color: #f4efe3; font: 12px/1.4 -apple-system, "SF Pro Text", sans-serif;

  #hud.used { opacity: 0; transform: translate(-50%, -50%) translateX(-5px); }
  .hint-row { display: flex; align-items: center; gap: 12px; }
  .look-gesture { width: 81px; display: flex; justify-content: center; }
  .look-gesture svg { width: 64px; height: 32px; overflow: visible; }
  #hud kbd { display: grid; place-items: center; height: 24px;

  .move-keys kbd.held { background: rgba(244,239,227,.36); }
  /* V260 - TURN IT SIDEWAYS: on a phone held upright the island is a sliver (the lens

     sideways the pill is gone, and a tap dismisses it for the session. */
  #turn { position: fixed; left: 50%; top: calc(14% + env(safe-area-inset-top, 0px)); transform: translateX(-50%);

  #turn span { white-space: nowrap; }
  #turn small { display: block; opacity: .7; font-size: 10px; letter-spacing: .04em; }
  body.touch #turn { display: flex; }
  body.touch #turn.gone { display: none; }
  @media (orientation: landscape) { #turn { display: none !important; } }
  @keyframes turn-phone { 0%, 30% { transform: rotate(0deg); } 55%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
  @media (prefers-reduced-motion: reduce) { #turn svg { animation: none; transform: rotate(-90deg); } }

  @media (prefers-reduced-motion: reduce) { #hud { transition: opacity .2s; } }

  body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #stick {
    position: fixed; display: none; width: 112px; height: 112px; border-radius: 50%;

    touch-action: none; opacity: .78; transition: opacity .5s;

  #stick .base { position: absolute; inset: 0; border-radius: 50%;

  #stick .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;

    transition: transform .12s ease-out; }
  #stick.live .knob { transition: none; background: rgba(244,239,227,.8); }
  #stick .lbl { position: absolute; left: 0; right: 0; bottom: -20px; text-align: center; color: #f4efe3;
    font: 11px/1 -apple-system, "SF Pro Text", sans-serif; letter-spacing: .08em; text-shadow: 0 1px 4px rgba(20,20,40,.4); }
  body.touch #hud { left: 50%; top: 42%; }   /* in the sky above the island, not over it */
  body.touch .row-move { display: none; }   /* a finger drags to look and moves with the stick */
  body.touch .look-gesture .mouse { display: none; }   /* the arrows stay, the mouse glyph goes */
  #fps {
    display: none;
    position: fixed; right: 14px; top: 12px; color: #efe9dc;
    font: 12px/1.4 ui-monospace, Menlo, monospace; opacity: .85;

  }
  body:has(#panel[open]) #fps { display: block; }
  .hud-panel {

    background: linear-gradient(160deg, rgba(38,44,66,.82), rgba(24,28,44,.82));
    border: 1px solid rgba(244,239,227,.14);
    border-radius: 12px; box-shadow: 0 6px 24px rgba(10,12,24,.35);
    padding: 10px 14px 12px; backdrop-filter: blur(8px); user-select: none;
  }
  .hud-panel summary {
    cursor: pointer; font-weight: 650; letter-spacing: .12em;
    text-transform: uppercase; font-size: 11px; opacity: .85;
    margin-bottom: 4px; color: #e8d9ae;

  .hud-panel .row { display: flex; align-items: center; gap: 10px; }
  .hud-panel .row label { width: 92px; opacity: .92; }

  .hud-panel input[type=range] { width: 116px; accent-color: #e8b96a; }

  .hud-panel select, .hud-panel button { font: inherit; background: rgba(232,185,106,.16);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Isola Quieta — live world</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5d5f7e; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 29%; top: 61%;
    transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
    color: #f4efe3; font: 12px/1.4 -apple-system, "SF Pro Text", sans-serif;
    letter-spacing: .04em; pointer-events: none; opacity: .78;
    text-shadow: 0 1px 5px rgba(20,20,40,.35);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  #hud.used { opacity: 0; transform: translate(-50%, -50%) translateX(-5px); }
  .hint-row { display: flex; align-items: center; gap: 12px; }
  .look-gesture { width: 81px; display: flex; justify-content: center; }
  .look-gesture svg { width: 64px; height: 32px; overflow: visible; }
  .move-keys { display: grid; grid-template-columns: repeat(3, 25px); gap: 3px; }
  .move-keys kbd { display: grid; place-items: center; height: 24px;
    font: 11px/1 -apple-system, "SF Pro Text", sans-serif;
    border: 1px solid rgba(244,239,227,.48); border-radius: 5px;
    background: rgba(35,43,51,.19); box-shadow: 0 1px 0 rgba(244,239,227,.16);
  }
  .move-keys kbd:first-child { grid-column: 2; }
  .move-keys kbd:nth-child(2) { grid-column: 1; }
  .move-keys kbd.held { background: rgba(244,239,227,.36); }
  @media (prefers-reduced-motion: reduce) { #hud { transition: opacity .2s; } }
  /* V237 - TOUCH ('work on mobile too'): the canvas owns every touch (no
     scroll, no pinch-zoom, no double-tap zoom), one finger looks, a thumb
     stick at the bottom-left moves. body.touch is set by the media query
     or by the first touch pointer, whichever comes first. */
  #app { touch-action: none; }
  body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #stick {
    position: fixed; display: none; width: 112px; height: 112px; border-radius: 50%;
    left: calc(22px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    touch-action: none; opacity: .78; transition: opacity .5s;
  }
  body.touch #stick { display: block; }
  #stick .base { position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(244,239,227,.5); background: rgba(35,43,51,.22); backdrop-filter: blur(4px); }
  #stick .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: rgba(244,239,227,.55); box-shadow: 0 1px 6px rgba(20,20,40,.35);
    transition: transform .12s ease-out; }
  #stick.live .knob { transition: none; background: rgba(244,239,227,.8); }
  #stick .lbl { position: absolute; left: 0; right: 0; bottom: -20px; text-align: center; color: #f4efe3;
    font: 11px/1 -apple-system, "SF Pro Text", sans-serif; letter-spacing: .08em; text-shadow: 0 1px 4px rgba(20,20,40,.4); }
  body.touch #hud { left: 50%; top: 42%; }   /* in the sky above the island, not over it */
  body.touch #hud .hint-row:first-child { display: none; }
  body.touch .look-gesture svg rect, body.touch .look-gesture svg path:nth-of-type(1), body.touch .look-gesture svg path:nth-of-type(2) { display: none; }   /* the arrows stay, the mouse goes */
  .lk-touch { display: none; }
  body.touch .lk-mouse { display: none; }
  body.touch .lk-touch { display: inline; }
  /* V239/V240 - MOUSE LOOK (Eric: 'just follow the mouse when you enter';
     'esc ... a lil esc icon at the top that says to stop looking around'):
     the view follows the cursor from the moment you enter; Esc (the key, or
     the chip at the top) frees the cursor; a click in the world looks again
     and holds the mouse. Hidden on touch, where the stick and the drag are it. */
  #lookchip {
    position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; color: #f4efe3;
    font: 11px/1 -apple-system, "SF Pro Text", sans-serif; letter-spacing: .1em; text-transform: uppercase;
    padding: 7px 11px 7px 8px; border-radius: 999px; background: rgba(35,43,51,.28); border: 1px solid rgba(244,239,227,.3);
    opacity: .72; backdrop-filter: blur(6px); cursor: pointer; user-select: none; transition: opacity .4s;
  }
  #lookchip:hover { opacity: 1; }
  #lookchip kbd { display: grid; place-items: center; height: 20px; padding: 0 6px; font: 10px/1 -apple-system, "SF Pro Text", sans-serif;
    letter-spacing: .08em; border: 1px solid rgba(244,239,227,.55); border-radius: 5px; background: rgba(35,43,51,.25); box-shadow: 0 1px 0 rgba(244,239,227,.2); }
  #lookchip .when-free, body.free #lookchip .when-looking, body.free #lookchip kbd { display: none; }
  body.free #lookchip .when-free { display: inline; }
  body.touch #lookchip { display: none; }
  body.locked { cursor: none; }
  #fps {
    display: none;
    position: fixed; right: 14px; top: 12px; color: #efe9dc;
    font: 12px/1.4 ui-monospace, Menlo, monospace; opacity: .85;
    text-shadow: 0 1px 3px rgba(20,20,40,.7); pointer-events: none;
    text-align: right;
  }
  body:has(#panel[open]) #fps { display: block; }
  .hud-panel {
    position: fixed; left: 14px; top: 12px; color: #f4efe3;
    font: 13px/1.85 -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, rgba(38,44,66,.82), rgba(24,28,44,.82));
    border: 1px solid rgba(244,239,227,.14);
    border-radius: 12px; box-shadow: 0 6px 24px rgba(10,12,24,.35);
    padding: 10px 14px 12px; backdrop-filter: blur(8px); user-select: none;
  }
  .hud-panel summary {
    cursor: pointer; font-weight: 650; letter-spacing: .12em;
    text-transform: uppercase; font-size: 11px; opacity: .85;
    margin-bottom: 4px; color: #e8d9ae;
  }
  .hud-panel .row { display: flex; align-items: center; gap: 10px; }
  .hud-panel .row label { width: 92px; opacity: .92; }
  .hud-panel .row output { width: 36px; text-align: right;
    font-variant-numeric: tabular-nums; color: #e8d9ae; }
  .hud-panel input[type=range] { width: 116px; accent-color: #e8b96a; }
  .hud-panel input[type=checkbox] { accent-color: #e8b96a; }
  .hud-panel select, .hud-panel button { font: inherit; background: rgba(232,185,106,.16);
                  color: inherit; border: 1px solid rgba(232,185,106,.35);
                  border-radius: 6px; padding: 2px 6px; }
  /* V207 (Eric: 'get rid of the look'), V223 (Eric: 'remove the settings on
     the left, it's not necessary'): the visitor sees no panel at all. The full
     LOOK panel - cameras, review views, wind, sun angle, painterly dials -
     stays in the DOM for the review scripts and shows only with ?dev=1. */
  #panel { display: none; }
  body.dev #panel { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #efe9dc; background: #5d5f7e;
    font: 14px ui-monospace, Menlo, monospace; transition: opacity .6s;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud" aria-label="Use W A S D to move. Move the mouse to look around; click to hold the mouse, Escape releases it.">
  <span class="hint-row" aria-hidden="true"><span class="move-keys"><kbd data-key="w">W</kbd><kbd data-key="a">A</kbd><kbd data-key="s">S</kbd><kbd data-key="d">D</kbd></span><span>move</span></span>
  <span class="hint-row" aria-hidden="true"><span class="look-gesture">
    <svg viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
      <rect x="23" y="3" width="18" height="26" rx="8" fill="rgba(35,43,51,.19)"/>
      <path d="M32 3v10h-9"/>
      <path d="M24 12V11a8 8 0 0 1 7-7v8Z" fill="currentColor" fill-opacity=".3" stroke="none"/>
      <path d="M17 16H4m4-4-4 4 4 4m39-4h13m-4-4 4 4-4 4"/>
    </svg>
  </span><span><span class="lk-mouse">move the mouse to look · click to hold it</span><span class="lk-touch">drag to look</span></span></span>
</div>
<div id="lookchip" role="status"><kbd>esc</kbd><span class="when-looking">stop looking around</span><span class="when-free">click to look around</span></div>
<div id="fps"></div>
<div id="stick" aria-label="Move stick"><div class="base"></div><div class="knob"></div><div class="lbl">move</div></div>
<details id="panel" class="hud-panel">
  <summary>look</summary>
  <div class="row"><label>painterly</label><input id="c-on" type="checkbox" checked></div>
  <div class="row"><label>kuwahara</label><input id="c-mix" type="range" min="0" max="1" step="0.05" value="0.12"><output id="o-mix">0.12</output></div>
  <div class="row"><label>radius</label><input id="c-rad" type="range" min="1" max="6" step="1" value="4"><output id="o-rad">4</output></div>
  <div class="row"><label>ink line</label><input id="c-edge" type="range" min="0" max="1" step="0.05" value="0.35"><output id="o-edge">0.35</output></div>
  <div class="row"><label>grain</label><input id="c-grain" type="range" min="0" max="0.1" step="0.005" value="0.04"><output id="o-grain">0.04</output></div>
  <div class="row"><label>saturation</label><input id="c-sat" type="range" min="0.9" max="1.3" step="0.01" value="1.10"><output id="o-sat">1.10</output></div>
  <div class="row"><label>sepia</label><input id="c-sepia" type="range" min="0" max="1" step="0.05" value="0.10"><output id="o-sepia">0.10</output></div>
  <div class="row"><label>cel shading</label><input id="c-cel" type="range" min="0" max="1" step="0.05" value="0"><output id="o-cel">0.00</output></div>
  <div class="row"><label>wind</label><input id="c-wind" type="checkbox" checked></div>
  <div class="row"><label>wind m/s</label><input id="c-wspd" type="range" min="0" max="8" step="0.1" value="1.8"><output id="o-wspd">1.8</output></div>
  <div class="row"><label>lighting</label><select id="c-light">
    <option value="painted">painted (baked)</option>
    <option value="sun" selected>live sun</option>
  </select></div>
  <div class="row"><label>sun angle</label><input id="c-sun" type="range" min="0" max="1" step="0.01" value="0.5"><output id="o-sun">0.50</output><button id="c-sun-view" type="button">look at sun</button></div>
  <div class="row"><label>camera</label><select id="c-cam"><option value="fly">fly (WASD)</option><option value="orbit">orbit</option></select></div>
  <div class="row"><label>visit</label><button id="c-shore" type="button">boat &amp; pier</button><button id="c-pier" type="button">pier supports</button><button id="c-hero" type="button">hero</button><button id="c-laundry" type="button">laundry</button></div>
  <div class="row"><label>cottage</label><button id="c-house" type="button">facade detail</button><button id="c-rear" type="button">rear facade</button><button id="c-plaster" type="button">plaster corner</button><button id="c-gable" type="button">gable side</button><button id="c-rear-detail" type="button">rear joinery</button><button id="c-chimney" type="button">chimney</button><button id="c-eave" type="button">roof edge</button><button id="c-chimney-back" type="button">chimney reverse</button></div>
  <div class="row"><label for="c-window-variant">windows</label><select id="c-window-variant"><option value="">choose an opening</option></select></div>
  <div class="row"><label>joinery</label><button id="c-window-detail" type="button">window detail</button><button id="c-window-angle" type="button">window angle</button><button id="c-door-detail" type="button">door detail</button></div>
  <div class="row"><label>meadow</label><button id="c-flowers" type="button">flowers</button><button id="c-path" type="button">garden approach</button><button id="c-entry" type="button">front approach</button></div>
  <div class="row"><label>review</label><select id="c-review"><option value="">choose view</option><option value="hero_camera">hero comparison</option><option value="corner_front_west">front west corner</option><option value="corner_front_east">front east corner</option><option value="corner_rear_east">rear east corner</option><option value="corner_rear_west">rear west corner</option><option value="flower_meadow">flower and grass motion</option><option value="shore_near">shoreline near</option><option value="shore_far">shoreline distant zoom</option><option value="front_steps">front doorstep</option><option value="tree_reference">tree reference scale</option><option value="west_gable">west gable paint</option><option value="west_seam">west gable seam</option><option value="rear_crafted">rear crafted facade</option><option value="sill_flowers">kitchen flower box</option><option value="orbit_000">orbit 000</option><option value="orbit_045">orbit 045</option><option value="orbit_090">orbit 090</option><option value="orbit_135">orbit 135</option><option value="orbit_180">orbit 180</option><option value="orbit_225">orbit 225</option><option value="orbit_270">orbit 270</option><option value="orbit_315">orbit 315</option></select></div>
  <div class="row"><label>tree</label><button id="c-bench" type="button">bench</button><button id="c-tree" type="button">whole tree</button><button id="c-bark" type="button">bark</button><button id="c-leaves" type="button">leaves</button><button id="c-tree-side" type="button">tree side</button><button id="c-twigs" type="button">twigs &amp; leaves</button></div>
  <div class="row"><label>horizon</label><input id="c-hz" type="range" min="0" max="0.30" step="0.001" value="0.122"><output id="o-hz">0.122</output></div>
  <div class="row"><label>paint cone</label><input id="c-hcone" type="range" min="5" max="45" step="1" value="20"><output id="o-hcone">20</output></div>
  <div class="row"><label>paint fade</label><input id="c-hnear" type="range" min="0" max="0.8" step="0.01" value="0.45"><output id="o-hnear">0.45</output></div>
</details>
<div id="loading">pouring the watercolours…</div>
<script type="module">
// the program is dist/main.js (one bundle: scripts/build.mjs); ?src=1 loads the unbundled
// sources for development; the build tag is the cache key (tests/build-tag.test.mjs keeps this
// line and main.js's BUILD in step); ?cb=<x> busts it while developing
const q = new URLSearchParams(location.search);
import((q.has('src') ? './src/main.js' : './dist/main.js') + '?v=v244' + (q.get('cb') ? '&cb=' + encodeURIComponent(q.get('cb')) : ''));
</script>
</body>
</html>

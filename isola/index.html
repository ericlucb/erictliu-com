<!-- the LOOK panel (?dev=1) is built by src/dev-panel.js; its styles are .hud-panel above -->
<!-- THE OPENING: the painting, placed by the script below before anything else runs (web/src/opening.js takes it from there) -->
<div id="opening" aria-hidden="true"><div class="sharp"><img alt="" src="./opening.webp?v=v292" decoding="async" fetchpriority="high"><div class="mir r"><img alt="" src="./opening.webp?v=v292"></div><div class="mir l"><img alt="" src="./opening.webp?v=v292"></div></div></div>
<div id="loading" role="progressbar" aria-label="Loading the island" aria-valuemin="0" aria-valuemax="100"><svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="11"/><circle class="fill" cx="12" cy="12" r="11"/></svg><span class="pct"></span><span class="txt">pouring the watercolours…</span></div>
<script>
// THE OPENING'S FIRST PAINT. The painting (opening.webp: reference/hero.webp with the water run on below it,
// scripts/make_opening.mjs) is the hero frame at 2.4:1, so at any window it lands where the hero camera puts the
// scene: scaled by the lens's focal length over the painting's (3840 px), its optical axis on the camera's. The
// arithmetic is framing.js's (heroFov, heroShiftX, HORIZON_SHIFT: paintingPlacement), repeated here so the
// painting is placed before the program arrives; tests/opening.test.mjs holds the two equal at every aspect.
// Above the painting the sky runs on as the live sky's own gradient (read off the hero render by height); a
// window wider than the painting's coverage (a square-ish iPad, an ultra-wide) takes a mirrored copy at the side.
window.ISOLA_OPENING = (() => {
  const root = document.getElementById('opening'), q = new URLSearchParams(location.search);
  if (q.get('opening') === '0') { root.remove(); return null; }
  document.body.classList.add('opening');
  const embed = q.has('embed') && window.parent !== window;
  if (embed) document.body.classList.add('embed');
  const IMG = { w: 3840, h: 2448 };   // painting px the file covers (scripts/make_opening.mjs)
  const SKY = [[-1400, '32,95,152'], [-400, '34,98,155'], [-200, '43,108,162'], [0, '55,126,165']];   // painting y -> the live sky above the painting
  function place(w, h) {
    const a = w / h, s = h * Math.min(Math.max(a, 1), 2.4) / 3840;   // the hero lens: tan(fov/2) = 0.5 / clamp(a, 1, 2.4), focal = h / 2 / tan
    const t = Math.min(Math.max((a - 2.4) / (5120 / 1440 - 2.4), 0), 1), narrow = Math.min(Math.max((a - 1) / 0.6, 0), 1);
    const shift = (-0.135 + t * (-0.2068 + 0.135)) * narrow;          // heroShiftX
    return { s, x: w * (0.5 - shift) - 3840 * (0.5 + 0.135) * s, y: h * (0.5 + 0.122) - 1600 * (0.5 + 0.122) * s };
  }
  const sharp = root.querySelector('.sharp'), img = sharp.querySelector('img'), mr = root.querySelector('.mir.r'), ml = root.querySelector('.mir.l');
  function layout() {
    const w = innerWidth, h = innerHeight, p = place(w, h), W = IMG.w * p.s, H = IMG.h * p.s, px = (v) => v.toFixed(1) + 'px';
    const box = (el, x) => { el.style.left = px(x); el.style.top = px(p.y); el.style.width = px(W); el.style.height = px(H); };
    box(img, p.x);
    sharp.style.background = 'linear-gradient(to bottom, ' + SKY.map(([y, c]) => `rgb(${c}) ${px(p.y + y * p.s)}`).join(', ') + `, rgb(86,104,113) ${px(p.y + H)})`;
    const F = 1100 * p.s, right = p.x + W;   // a mirrored copy fades out over 1100 painting px
    mr.style.display = right < w ? 'block' : 'none'; mr.style.left = px(right); mr.style.width = px(F); box(mr.firstChild, 0);
    ml.style.display = p.x > 0 ? 'block' : 'none'; ml.style.left = px(p.x - F); ml.style.width = px(F); box(ml.firstChild, F - W);
  }
  layout();
  addEventListener('resize', layout);
  // shown once decoded and on screen; behind the door that is the door's cue to open ('painting')
  const shown = new Promise((res) => {
    let told = false;   // (a frame's paint, or 150 ms if the busy loading thread holds the frames back: the door's fade takes longer than that)
    const tell = () => { if (told) return; told = true; res(performance.now()); if (embed) window.parent.postMessage({ isola: 'v1', type: 'painting' }, location.origin); };
    const go = () => { root.classList.add('shown'); requestAnimationFrame(() => requestAnimationFrame(tell)); setTimeout(tell, 150); };
    const failed = () => { root.remove(); document.body.classList.remove('opening'); res(0); };   // no painting: the plain panel
    (img.decode ? img.decode() : Promise.reject(new Error('no decode'))).then(go, () => {
      if (img.complete && img.naturalWidth) go();
      else if (img.complete) failed();
      else { img.addEventListener('load', go, { once: true }); img.addEventListener('error', failed, { once: true }); }
    });
  });
  return { root, layout, place, shown, IMG, SKY };
})();
</script>
<script type="module">
// the program is dist/main.js (one bundle: scripts/build.mjs); ?src=1 loads the unbundled
// sources for development; the build tag is the cache key (tests/build-tag.test.mjs keeps this
// line and main.js's BUILD in step); ?cb=<x> busts it while developing
const q = new URLSearchParams(location.search);
// the height grids leave with the program, not after it (a <link preload> did this in Chrome; WebKit fetched them twice)
window.GRIDS_FETCH = fetch('./world-grids.bin?v=v292');
import((q.has('src') ? './src/main.js' : './dist/main.js') + '?v=v292' + (q.get('cb') ? '&cb=' + encodeURIComponent(q.get('cb')) : ''))
  .catch((err) => {   // the program did not arrive, or stopped before its first frame: the panel and the door's error, once
    console.error(err);
    const el = document.getElementById('loading');
    if (!el || el.querySelector('button')) return;   // (the program's own failPanel already said it)
    el.style.opacity = 1; el.classList.add('failed'); el.textContent = 'The island could not load. ';
    const b = document.createElement('button'); b.textContent = 'Try again'; b.style.font = 'inherit'; b.style.marginLeft = '8px';
    b.addEventListener('click', () => location.reload()); el.appendChild(b);
    if (q.has('embed') && window.parent !== window) window.parent.postMessage({ isola: 'v1', type: 'error', message: 'The island could not load.' }, location.origin);
  });
</script>

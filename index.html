    let u, pit;
    if (L) {
      u = CL(this.lYaw.step(CL(yt, -1, 1), dt), -1, 1);
      pit = CL(this.lPit.step(CL(ty, -0.8, 1), dt), -0.85, 1.05);
    } else {
      this.sYaw.tune(RESP, CL(1 - 0.5 * BOUNCE, 0.35, 1.4));
      this.sPit.tune(RESP * 1.42, CL(1 - 0.52 * BOUNCE, 0.35, 1.4));
      u = CL(this.sYaw.step(yt, dt), -1, 1);
      pit = CL(this.sPit.step(CL(ty, -1, 1), dt), -1.08, 1.08);
    }

    const JX = u * TRAVEL;
    const JY = pit * TRAVEL * PITCH + (L ? 0 : 4.2 * u * u + breath * 2.4 * Math.sin(T * 1.45));

    // ---- one shared rigid-body transform for the whole head ----
    const roll = u * ROLL + (L ? 0 : breath * 0.5 * Math.sin(T * 0.93 + 1));
    const persp = L ? 0 : 0.055;
    const sx = 1 - persp * u * u, sy = 1 + persp * 0.3 * u * u;
    this.set(E.kHead, 'transform',
      'rotate(' + roll.toFixed(3) + ' 0 ' + PIV + ') translate(0 -34) scale(' + sx.toFixed(4) + ' ' + sy.toFixed(4) +
      ') translate(0 34) translate(0 132) skewX(' + (-u * 2.2).toFixed(2) + ') translate(0 -132)');
    if (this.dance || this.danceBop > 0.002) {
      const b = this.danceBop;
      E.kSvg.style.transformOrigin = '50% 84%';
      E.kSvg.style.transform = 'translateY(' + (-b * 14).toFixed(2) + 'px) rotate(' + (b * Math.sin(T * 1.9) * 2.1).toFixed(2) + 'deg) scale(' + (1 + b * 0.015).toFixed(4) + ')';
      this._bopSet = true;
    } else if (this._bopSet) { E.kSvg.style.transform = ''; this._bopSet = false; }
    this.set(E.kChinHead, 'transform', this.cache['kHead|transform']);

    // ---- layers ----
    const fX = GF * JX, fY = GF * JY;
    const fT = 'translate(' + fX.toFixed(2) + ' ' + fY.toFixed(2) + ')';
    this.set(E.kFace, 'transform', fT);
    this.set(E.kFaceLine, 'transform', fT);
    this.set(E.kClipHost, 'transform', fT);
    this.set(E.kNoseHost, 'transform', fT);
    this.set(E.kFeatShHost, 'transform', fT);
    this.set(E.kChinSh, 'transform', fT);

    // ---- hair: lerp the anchors, re-emit one Bezier path ----
    const uu = CL(u / UMAX, -1, 1);
    this.set(E.kHairClip, 'transform', fT);
    this.set(E.kHair, 'transform', fT);
    const hq = Math.round(SOFT(WRAP * uu, 1) * 40) / 40;
    if (this._hq !== hq) {
      this._hq = hq;
      const d = hairD(hq);
      E.kHairP.setAttribute('d', d);
      E.kHairShP.setAttribute('d', d);
    }

    // features: soft-limited so the far lens eases into the silhouette edge
    let ftX = GT * JX; const ftY = GT * JY;
    const pinch = Math.max(0, ftY) * 0.62;
    const limR = (78 - pinch + fX) - RX, limL = (-75.5 + pinch + fX) - LX;
    if (u > 0) ftX = L ? Math.min(ftX, limR) : softMin(ftX, limR, 4.5);
    if (u < 0) ftX = L ? Math.max(ftX, limL) : softMax(ftX, limL, 4.5);
    const rotF = u * 6.5;
    this.set(E.kFeat, 'transform',
      'translate(' + ftX.toFixed(2) + ' ' + ftY.toFixed(2) + ') rotate(' + rotF.toFixed(2) + ' 1 -14)');
    const relT = 'translate(' + (ftX - fX).toFixed(2) + ' ' + (ftY - fY).toFixed(2) + ') rotate(' + rotF.toFixed(2) + ' 1 -14)';
    this.set(E.kFeatIn, 'transform', relT);
    // the lenses show the hair behind them, with a whisker of magnification for depth:
    // an unmagnified copy underneath guarantees the glass never opens a gap at the rim
    this.set(E.kNoseIn, 'transform', relT);
    this.set(E.kFeatShIn, 'transform', relT);

    // ears
    const eX = 0;
    const earN = CL(u / UMAX, -1, 1);
    const earW = (lead) => Math.max(0.3, 1 - 0.94 * SS(0.08, 0.9, lead)) + 0.16 * SS(0.1, 0.85, -lead);
    const earO = (lead) => (1 - SS(0.42, 0.7, lead)).toFixed(3);
    this.set(E.kEarL, 'transform', 'translate(' + (-99 + eX + fX).toFixed(1) + ' ' + (fY - 3).toFixed(1) + ')');
    this.set(E.kEarR, 'transform', 'translate(' + (107 + eX + fX).toFixed(1) + ' ' + (fY - 3).toFixed(1) + ')');
    this.earD(E.kEarL.firstElementChild, earW(-earN), 1);
    this.earD(E.kEarR.firstElementChild, earW(earN), -1);
    this.set(E.kEarL, 'opacity', earO(-earN));
    this.set(E.kEarR, 'opacity', earO(earN));

    // Stems: rim -> just above the ear, both endpoints computed per frame in head space.
    const rr = rotF * Math.PI / 180, rC = Math.cos(rr), rSn = Math.sin(rr);
    const fmap = (x, y) => { const dx = x - 1, dy = y + 14; return [1 + dx * rC - dy * rSn + ftX, -14 + dx * rSn + dy * rC + ftY]; };
    const stem = (el, cx, cy, r, ax, ay, lead) => {
      const c = fmap(cx, cy), dx = ax - c[0], dy = ay - c[1], dd = Math.hypot(dx, dy) || 1;
      el.setAttribute('d', 'M ' + (c[0] + dx / dd * (r + 1.5)).toFixed(1) + ' ' + (c[1] + dy / dd * (r + 1.5)).toFixed(1) + ' L ' + ax.toFixed(1) + ' ' + ay.toFixed(1));
      el.setAttribute('opacity', (1 - SS(0.4, 0.78, lead)).toFixed(3));
    };
    stem(E.kStemL, LX, LY, 38.5, -99 + fX - 8 * earW(-earN), fY - 24, -uu);
    stem(E.kStemR, RX, RY, 36, 107 + fX + 8 * earW(earN), fY - 24, uu);

    // shadows are cast, not painted on: they slide against the turn
    this.set(E.kFeatShOff, 'transform', 'translate(' + (-1.4 - 3.2 * earN).toFixed(2) + ' ' + (5.4 + 1.2 * Math.abs(earN)).toFixed(2) + ')');

    // ---- blink ----
    if (LIFE && T > this.nextBlink) { this.blinkT = T; this.nextBlink = T + 7 + Math.random() * 7; }
    const bp = (T - this.blinkT) / 0.26;
    const cs = bp >= 0 && bp <= 1 ? Math.sin(bp * Math.PI) : 0;
    const closed = cs * cs;
    const pupS = 1 - 0.66 * closed, pupW = 1 + 0.42 * closed;
    const brP = (T - this.browT) / 0.6;
    const brRaise = brP >= 0 && brP <= 1 ? Math.sin(brP * Math.PI) : 0;
    this.set(E.kBrows, 'transform', 'translate(0 ' + (Math.max(0, -pit) * 9 - closed * 4.5 - brRaise * 10 - this.danceBrow * 7).toFixed(2) + ')');
    this.sEx.step(CL(tx, -1, 1), dt); this.sEy.step(CL(ty, -1, 1), dt);
    const ex = this.sEx.x, ey = this.sEy.x;
    this.set(E.kPupL, 'transform', 'translate(' + (LX + 5 + ex * 3).toFixed(2) + ' ' + (LY - 11 + ey * 2).toFixed(2) + ') scale(' + pupW.toFixed(3) + ' ' + pupS.toFixed(3) + ')');
    this.set(E.kPupR, 'transform', 'translate(' + (RX - 5 + ex * 3).toFixed(2) + ' ' + (RY - 11 + ey * 2).toFixed(2) + ') scale(' + pupW.toFixed(3) + ' ' + pupS.toFixed(3) + ')');

    // ---- small parts ----
    const dir = Math.tanh(u * 3.4);
    if (L) {
      const sxn = Math.abs(dir) < 0.22 ? (dir < 0 ? -0.22 : 0.22) : dir;
      this.set(E.kNoseC, 'transform', 'scale(' + sxn.toFixed(3) + ' 1)');
      this.set(E.kNoseC, 'vector-effect', 'non-scaling-stroke');
    } else {
      this.set(E.kNoseC, 'transform', '');
      this.set(E.kNoseC, 'vector-effect', 'none');
      const nd = this.noseD(dir);
      this.set(E.kNoseC, 'd', nd);
    }
    this.set(E.kNose, 'transform',
      'translate(' + (0.06 * JX).toFixed(2) + ' ' + (pit * 2 - 2).toFixed(2) +
      ') rotate(' + (7.5 * dir).toFixed(2) + ' 0 -10)');
    const un = CL(u / UMAX, -1, 1);
    const nu = un * (0.55 + 0.45 * un * un), na = (L ? 0 : 5) * nu, nt = (L ? 0 : -5.5) * nu;
    // one shared pivot so the white neck fill stays registered to both neck lines
    const nT = 'rotate(' + na.toFixed(2) + ' -9.1 110) translate(' + nt.toFixed(1) + ' 0)';
    this.set(E.kNeckL, 'transform', nT);
    this.set(E.kNeckR, 'transform', nT);
    this.set(E.kNeckFill, 'transform', nT);
    this.set(E.kNeckClipP, 'transform', nT);
    this.set(E.kMouth, 'transform', 'translate(' + (u * 4).toFixed(2) + ' ' + (pit * 2).toFixed(2) + ') rotate(' + (-un * 5).toFixed(2) + ' 0 60)');
    const mq = Math.round(un * 20) / 20;
    if (this._mq !== mq) {
      this._mq = mq;
      const a = Math.abs(mq), bend = 6.5 * a, w = 30.5 - 3 * a, s2 = -mq;
      E.kMouthP.setAttribute('d', 'M ' + (-w) + ' ' + (56.3 - bend * 0.35 + s2 * 4.3).toFixed(1) +
        ' C ' + (-10.2 + s2 * 1.1).toFixed(1) + ' ' + (64.25 + bend * 0.9 + s2 * 1.45).toFixed(1) +
        ' ' + (10.2 + s2 * 1.1).toFixed(1) + ' ' + (64.25 + bend * 0.9 - s2 * 1.45).toFixed(1) +
        ' ' + w + ' ' + (56.3 - bend * 0.35 - s2 * 4.3).toFixed(1));
    }

    // ---- readout ----
    this.ft += ((now - (this._prev || now - 16.7)) - this.ft) * 0.06; this._prev = now;
    if (this.stats) {
      if (T - (this.statT || 0) > 0.28) {
        this.statT = T;
        E.kReadout.textContent = (1000 / Math.max(this.ft, 0.5)).toFixed(0) + ' fps · ' + this.ft.toFixed(1) + ' ms';
      }
    } else if (this._lastLabel !== (L ? 1 : 0)) {
      this._lastLabel = L ? 1 : 0;
      E.kReadout.textContent = L ? 'original rig' : 'bezier rig';
    }
  }

  renderVals() { return {}; }
}
</script>
